<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Inventário</title>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Inventário</h1>
            <h2 id="espaco">Espaço: 0/0</h2>
            <p>A capacidade do inventário é calculada com base na Força da ficha.</p>
        </header>

        <input type="hidden" id="forca" value="0">

        <section class="section">
            <h2 class="section-title">Armas</h2>
            <div id="lista-armas"></div>
            <div class="actions">
                <button type="button" class="adicionar" id="adicionar-arma">
                    + Adicionar arma
                </button>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Itens</h2>
            <div id="lista-itens"></div>
            <div class="actions">
                <button type="button" class="adicionar" id="adicionar-item">
                    + Adicionar item
                </button>
            </div>
        </section>

        <section class="section">
            <p>Armas, itens e seus espaços são salvos automaticamente.</p>
        </section>

        <div class="actions">
            <a class="btn-3d" href="index.html">Voltar para a Ficha</a>
        </div>
    </main>
    <script type="module" src="src/pages/inventario-page.js"></script>
</body>
</html>
